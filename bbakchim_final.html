<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Nanum Gothic',sans-serif;
    background:#f7f4ee;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:1.5rem 1rem 3rem;
    gap:0.9rem;
  }
  h1{font-size:13px;color:#9a9690;letter-spacing:.1em;font-weight:400;margin-top:.3rem;}
  .scene{width:100%;max-width:540px;}
  .scene svg{width:100%;height:auto;display:block;}
  .rage-wrap{width:100%;max-width:540px;}
  .rage-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .rage-lbl{font-size:11px;color:#9a9690;}
  .rage-total{font-size:13px;font-weight:700;color:#3a3835;}
  .rage-bg{background:#e8e4da;border-radius:8px;height:8px;overflow:hidden;}
  .rage-fill{height:100%;border-radius:8px;background:#EF9F27;transition:width .4s,background .4s;}
  .reset-btn{
    font-size:11px;color:#9a9690;background:none;
    border:1px solid #d5d0c8;border-radius:20px;
    padding:5px 18px;cursor:pointer;
    font-family:'Nanum Gothic',sans-serif;
    transition:all .2s;
  }
  .reset-btn:hover{color:#3a3835;border-color:#9a9690;}
  .status-txt{font-size:12px;color:#9a9690;text-align:center;min-height:18px;}
  .emoji-pop{
    position:fixed;pointer-events:none;font-size:26px;
    animation:floatUp 1s ease-out forwards;z-index:9999;
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-90px) scale(1.6);}
  }
</style>
</head>

<p class="status-txt" id="statusTxt">말풍선을 눌러봐요 (●'◡'●)</p>

<div class="rage-wrap">
  <div class="rage-row">
    <span class="rage-lbl">오늘의 빡침 게이지</span>
    <span class="rage-total">총 <span id="totalSpan">0</span>회</span>
  </div>
  <div class="rage-bg"><div class="rage-fill" id="rageFill" style="width:0%"></div></div>
</div>
<button class="reset-btn" onclick="resetAll()">오늘 하루 털어버리기 ↺</button>

<script>
const counts=new Array(9).fill(0);let total=0;
const statuses=[
  "말풍선을 눌러봐요 (●'◡'●)",
  "눈이 가늘어지는 중...",
  "이마에 힘 들어가는 중...",
  "뚜껑 열리기 직전",
  "입술 꾹 다뭄",
  "내가 왜 이걸...",
  "숨 크게 들이쉬는 중",
  "오늘 치킨은 내 거야",
  "퇴근만 바라보는 중",
  "괜찮아... 괜찮아..."
];

function updateFace(){
  const p=Math.min(1,total/20);
  document.getElementById('headFlush').setAttribute('opacity',(p*0.35).toFixed(2));
  const bop=(p*0.55).toFixed(2);
  document.getElementById('blushL').setAttribute('opacity',bop);
  document.getElementById('blushR').setAttribute('opacity',bop);
  document.getElementById('screenGlow').setAttribute('opacity',(p*0.5).toFixed(2));
  const r=Math.round(0xFA+(0xE2-0xFA)*p),g=Math.round(0xAE+(0x4B-0xAE)*p),b=Math.round(0xDA+(0x4A-0xDA)*p);
  document.getElementById('headBack').setAttribute('fill',`rgb(${r},${g},${b})`);
}

function getC(id){return document.querySelectorAll('#'+id+' .cb circle');}

function pop(i,e){
  counts[i]++;total++;
  document.getElementById('c'+i).textContent=counts[i]+'회';
  document.getElementById('totalSpan').textContent=total;
  const f=counts[i]>=5?'#FCEBEB':counts[i]>=2?'#FAEEDA':'#fffef5';
  getC('b'+i).forEach(c=>c.style.fill=f);
  document.querySelectorAll('#b'+i+' .cb rect').forEach(r=>r.style.fill=f);
  updateFace();updateSteam();updateRage();spawnEmoji(e);
  document.getElementById('statusTxt').textContent=statuses[Math.min(statuses.length-1,Math.floor(total/2))];
}

function updateSteam(){
  const s=document.getElementById('steamG'),e=document.getElementById('efx');
  if(total>=12){s.setAttribute('opacity','1');e.setAttribute('opacity','1');}
  else if(total>=6){s.setAttribute('opacity','0.6');e.setAttribute('opacity','0.5');}
  else if(total>=3){s.setAttribute('opacity','0.2');e.setAttribute('opacity','0');}
  else{s.setAttribute('opacity','0');e.setAttribute('opacity','0');}
}

function updateRage(){
  const pct=Math.min(100,total*4);
  const f=document.getElementById('rageFill');
  f.style.width=pct+'%';
  f.style.background=pct>70?'#E24B4A':pct>40?'#D85A30':'#EF9F27';
}

function spawnEmoji(e){
  const list=['💢','😤','🔥','💥','😠','👹','😡'];
  const el=document.createElement('div');
  el.className='emoji-pop';
  el.textContent=list[Math.floor(Math.random()*list.length)];
  el.style.left=(e.clientX-14)+'px';
  el.style.top=(e.clientY-14)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function resetAll(){
  for(let i=0;i<9;i++){
    counts[i]=0;
    document.getElementById('c'+i).textContent='0회';
    getC('b'+i).forEach(c=>c.style.fill='#fffef5');
    document.querySelectorAll('#b'+i+' .cb rect').forEach(r=>r.style.fill='#fffef5');
  }
  total=0;
  document.getElementById('totalSpan').textContent='0';
  document.getElementById('rageFill').style.width='0%';
  document.getElementById('rageFill').style.background='#EF9F27';
  document.getElementById('headBack').setAttribute('fill','#FAEEDA');
  document.getElementById('headFlush').setAttribute('opacity','0');
  document.getElementById('blushL').setAttribute('opacity','0');
  document.getElementById('blushR').setAttribute('opacity','0');
  document.getElementById('screenGlow').setAttribute('opacity','0');
  document.getElementById('steamG').setAttribute('opacity','0');
  document.getElementById('efx').setAttribute('opacity','0');
  document.getElementById('statusTxt').textContent='마음이 가벼워졌어요 ✨';
  setTimeout(()=>{document.getElementById('statusTxt').textContent="말풍선을 눌러봐요 (●'◡'●)";},2000);
}
</script>
