<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="시간은 결국 흘러">
  <meta name="theme-color" content="#f2ead8">
  <title>시간은 결국 흘러</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:   #f2ead8;
      --paper2:  #e8dfc8;
      --paper3:  #d8cdb0;
      --ink:     #2b1d0e;
      --ink2:    #5a4030;
      --ink3:    #8a7060;
      --red:     #c8001a;
      --red2:    #960012;
      --red3:    #5a000a;
      --stamp:   #8b3a1a;
      --rule:    rgba(43,29,14,0.12);
      --accent:  #b85c00;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background: var(--paper);
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      position: relative;
    }

    /* 노트 줄 배경 */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--rule) 31px,
        var(--rule) 32px
      );
      background-position: 0 48px;
    }

    /* 왼쪽 빨간 세로줄 (노트 마진선) */
    body::after {
      content: '';
      position: fixed; top:0; left:52px; bottom:0; z-index:0; pointer-events:none;
      width: 1.5px;
      background: rgba(200,0,26,0.25);
    }

    #root { position:relative; z-index:1; }

    /* 상단 스프링 구멍들 */
    .ring-holes {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      height: 28px;
      background: var(--paper2);
      border-bottom: 1.5px solid var(--paper3);
      display: flex; align-items: center; justify-content: center; gap: 32px;
    }
    .hole {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--paper);
      border: 1.5px solid var(--paper3);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.15);
    }

    /* 글귀 카드 */
    .quote-card {
      background: rgba(255,255,255,0.5);
      border: 1px dashed rgba(43,29,14,0.25);
      border-radius: 4px;
      padding: 14px 18px;
      max-width: 300px; width: 100%;
      position: relative;
    }
    .quote-card::before {
      content: '✦';
      position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: var(--accent);
      background: var(--paper); padding: 0 6px;
    }

    /* 하단 버튼들 */
    .retro-btn {
      border-radius: 3px;
      font-family: 'Nanum Gothic Coding', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .retro-btn:active { transform: translateY(1px); }

    @keyframes fadeUp    { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-14px)} }
    @keyframes popIn     { 0%{opacity:0;transform:scale(.5)} 70%{transform:scale(1.06)} 100%{opacity:1;transform:scale(1)} }
    @keyframes blink     { 0%,100%{opacity:1} 50%{opacity:0.1} }
    @keyframes dotBounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }
    @keyframes glowFade  { 0%{opacity:1;transform:scale(.9)} 100%{opacity:0;transform:scale(1.3)} }
    @keyframes stampInk  { 0%{opacity:0.8;transform:scale(1.05)} 100%{opacity:0;transform:scale(1.3)} }

    .popin-anim  { animation: popIn 0.4s cubic-bezier(.4,2,.6,1) forwards; }
    .fadeup-anim { animation: fadeUp 0.5s ease-out forwards; }
    .blink-anim  { animation: blink 1.4s infinite; }
  </style>
</head>
<body>

<!-- 스프링 구멍 -->
<div class="ring-holes">
  <div class="hole"></div><div class="hole"></div><div class="hole"></div>
  <div class="hole"></div><div class="hole"></div><div class="hole"></div>
  <div class="hole"></div><div class="hole"></div><div class="hole"></div>
</div>

<canvas id="fireworksCanvas" style="display:none;position:fixed;inset:0;z-index:100;pointer-events:none;"></canvas>
<div id="fireworksOverlay" style="display:none;position:fixed;inset:0;z-index:101;align-items:center;justify-content:center;pointer-events:none;"></div>
<div id="root"></div>

<script>
const SCHOOL_DAYS = ["2026-03-03","2026-03-04","2026-03-05","2026-03-06","2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13","2026-03-16","2026-03-17","2026-03-18","2026-03-19","2026-03-20","2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27","2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03","2026-04-06","2026-04-07","2026-04-08","2026-04-09","2026-04-10","2026-04-13","2026-04-14","2026-04-15","2026-04-16","2026-04-17","2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24","2026-04-27","2026-04-28","2026-04-29","2026-04-30","2026-05-01","2026-05-04","2026-05-05","2026-05-06","2026-05-07","2026-05-08","2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15","2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22","2026-05-25","2026-06-01","2026-06-02","2026-06-03","2026-06-04","2026-06-05","2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12","2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19","2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26","2026-06-29","2026-07-01","2026-07-02","2026-07-03","2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10","2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17","2026-07-20","2026-07-21","2026-09-01","2026-09-02","2026-09-03","2026-09-04","2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11","2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18","2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-28","2026-10-01","2026-10-02","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23","2026-10-26","2026-10-27","2026-11-02","2026-11-03","2026-11-04","2026-11-05","2026-11-06","2026-11-09","2026-11-10","2026-11-11","2026-11-12","2026-11-13","2026-11-16","2026-11-17","2026-11-18","2026-11-19","2026-11-20","2026-11-23","2026-11-24","2026-11-25","2026-11-26","2026-11-27","2026-12-01","2026-12-02","2026-12-03","2026-12-04","2026-12-07","2026-12-08","2026-12-09","2026-12-10","2026-12-11","2026-12-14","2026-12-15","2026-12-16","2026-12-17","2026-12-18","2026-12-21","2026-12-22","2026-12-23","2026-12-24","2026-12-25","2026-12-28","2026-12-29","2026-12-30","2027-01-04","2027-01-05","2027-01-06","2027-01-07","2027-01-08"];

const TOTAL = SCHOOL_DAYS.length;
const MONTHS = [
  {label:"3월",days:21},{label:"4월",days:22},{label:"5월",days:17},
  {label:"6월",days:21},{label:"7월",days:15},{label:"9월",days:20},
  {label:"10월",days:19},{label:"11월",days:20},{label:"12월",days:22},
  {label:"1월",days:5},
];
const MILESTONES=(()=>{let a=0;return MONTHS.map(m=>{a+=m.days;return{label:m.label,at:a};});})();
const FW_COLORS=["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff922b","#cc5de8","#f06595","#38d9a9"];

function calcDoneFromDate(){
  const t=new Date().toISOString().slice(0,10);
  let c=0; for(const d of SCHOOL_DAYS){if(d<=t)c++;else break;} return c;
}
function loadOffset(){return parseInt(localStorage.getItem('tracker_offset')||'0');}
function saveOffset(v){localStorage.setItem('tracker_offset',v);}

let offset=loadOffset();
let done=Math.max(0,Math.min(TOTAL,calcDoneFromDate()+offset));
let quote=null,quoteSource=null,quoteVisible=false,loadingQuote=false,animating=false;

function getRemaining(){return TOTAL-done;}
function getPct(){return(done/TOTAL)*100;}
function isTodaySchoolDay(){return SCHOOL_DAYS.includes(new Date().toISOString().slice(0,10));}
function getTodayLabel(){
  const t=new Date(),days=['일','월','화','수','목','금','토'];
  return (t.getMonth()+1)+'월 '+t.getDate()+'일 ('+days[t.getDay()]+') '+(isTodaySchoolDay()?'📚':'🌿');
}
function getMessage(){
  const r=getRemaining();
  if(r===0) return{text:"모든 수업 완료! 🎉",sub:"정말 수고하셨습니다"};
  if(r<=10) return{text:"거의 다 왔어요 🔥",sub:r+"일만 더!"};
  if(r<=30) return{text:"막바지입니다 💪",sub:r+"일 남았어요"};
  if(r<=95) return{text:"절반 넘었어요",sub:r+"일 남았어요"};
  return{text:"오늘 일은 사무실에 두고 나와",sub:r+"일 남았어요"};
}

// Fireworks
function rb(a,b){return a+Math.random()*(b-a);}
function launchFireworks(){
  const cv=document.getElementById('fireworksCanvas');
  cv.style.display='block';cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext('2d'),ps=[];
  const burst=(x,y)=>{
    const c=FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
    for(let i=0;i<80;i++){const a=(Math.PI*2*i)/80+rb(-0.1,0.1),s=rb(2,9);
      ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,alpha:1,r:rb(2,5),c,g:0.18,d:rb(0.012,0.022)});}
  };
  const pos=[[cv.width*.25,cv.height*.3],[cv.width*.75,cv.height*.25],
    [cv.width*.5,cv.height*.2],[cv.width*.2,cv.height*.5],
    [cv.width*.8,cv.height*.45],[cv.width*.5,cv.height*.4]];
  let idx=0;
  const t=setInterval(()=>{if(idx<pos.length)burst(...pos[idx++]);else clearInterval(t);},160);
  const anim=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=0.98;p.alpha-=p.d;
      if(p.alpha<=0){ps.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=p.alpha;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c;ctx.shadowBlur=8;ctx.shadowColor=p.c;ctx.fill();ctx.restore();}
    if(ps.length>0)requestAnimationFrame(anim);else{cv.style.display='none';hideFireworkOverlay();}
  };
  requestAnimationFrame(anim);
}
function showFireworkOverlay(m){
  const ov=document.getElementById('fireworksOverlay');
  ov.style.display='flex';
  ov.innerHTML='<div class="popin-anim" style="text-align:center;background:#f2ead8;border:3px solid #2b1d0e;border-radius:6px;padding:32px 48px;box-shadow:6px 6px 0 #2b1d0e">'
    +'<div style="font-size:52px;line-height:1">🎉</div>'
    +'<div style="font-size:26px;font-weight:900;margin-top:12px;color:#2b1d0e;font-family:serif">'+(m===0?'완주!':m+'일 남았어요!')+'</div>'
    +'<div style="font-size:13px;color:#8a7060;margin-top:6px;font-family:monospace">'+(m===0?'모든 수업 완료 ★':(TOTAL-m)+'일째 달성!')+'</div>'
    +'</div>';
  setTimeout(hideFireworkOverlay,2800);
}
function hideFireworkOverlay(){document.getElementById('fireworksOverlay').style.display='none';}

// Quote
async function fetchQuote(remaining){
  const prompt='한국 또는 세계 고전 문학 작품(소설, 시, 수필 등)에서 인상적인 글귀 하나를 골라줘.\n수업을 하루 마친 선생님에게 위로나 영감을 주는 내용이면 더 좋아. 남은 수업일은 '+remaining+'일이야.\n반드시 JSON 형식으로만 응답해. 다른 말은 절대 하지 마.\n{"quote": "글귀 내용", "source": "작품명 - 작가"}';
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();
  const text=data.content?.find(b=>b.type==="text")?.text||"";
  return JSON.parse(text.replace(/```json|```/g,"").trim());
}
async function loadQuote(remaining){
  loadingQuote=true;quoteVisible=false;renderQuote();
  try{const r=await fetchQuote(remaining);quote=r.quote;quoteSource=r.source;}
  catch{quote="하루하루가 쌓여 한 해가 된다.";quoteSource="작자 미상";}
  loadingQuote=false;
  setTimeout(()=>{quoteVisible=true;renderQuote();},80);
}

function renderQuote(){
  const el=document.getElementById('quoteArea');
  if(!el)return;
  if(loadingQuote){
    el.innerHTML='<div class="quote-card" style="display:flex;align-items:center;justify-content:center;min-height:64px">'
      +'<div style="display:flex;gap:8px">'
      +[0,1,2].map(i=>'<div style="width:7px;height:7px;border-radius:50%;background:#8a7060;animation:dotBounce 0.8s '+(i*0.15)+'s infinite ease-in-out"></div>').join('')
      +'</div></div>';
  } else if(quote){
    el.innerHTML='<div class="quote-card" style="opacity:'+(quoteVisible?1:0)+';transform:'+(quoteVisible?'translateY(0)':'translateY(8px)')+';transition:opacity 0.5s,transform 0.5s">'
      +'<div style="font-size:13px;line-height:1.8;color:#3a2810;font-style:italic;font-family:\'Libre Baskerville\',Georgia,serif">"'+quote+'"</div>'
      +(quoteSource?'<div style="margin-top:8px;font-size:10px;color:#8a7060;font-family:monospace;letter-spacing:0.5px">— '+quoteSource+'</div>':'')
      +'</div>';
  } else {
    el.innerHTML='';
  }
}

function renderProgressBar(){
  const pct=getPct();
  const markers=MILESTONES.map((m,i)=>{
    const mp=(m.at/TOTAL)*100;
    const isR=done>=m.at,isC=done<m.at&&(i===0||done>=MILESTONES[i-1].at);
    const sz=i===MILESTONES.length-1?11:7;
    return '<div style="position:absolute;left:'+mp+'%;top:50%;transform:translate(-50%,-50%);z-index:2;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+(isR?'#c8001a':isC?'#f2ead8':'rgba(43,29,14,0.15)')+';border:2px solid '+(isC?'#c8001a':isR?'#960012':'rgba(43,29,14,0.2)')+';box-shadow:'+(isR?'0 0 5px rgba(200,0,26,0.4)':isC?'0 0 7px rgba(200,0,26,0.5)':'none')+';transition:all 0.4s"></div>';
  }).join('');
  const labels=MILESTONES.map((m,i)=>{
    const mp=(m.at/TOTAL)*100;
    const isR=done>=m.at,isC=done<m.at&&(i===0||done>=MILESTONES[i-1].at);
    const l=mp>90?'auto':mp<10?'0':mp+'%',r=mp>90?'0':'auto';
    const tr=mp>90?'none':mp<10?'none':'translateX(-50%)';
    return '<div style="position:absolute;left:'+l+';right:'+r+';transform:'+tr+';top:0;text-align:center">'
      +'<div style="font-size:9px;font-weight:'+(isC?800:isR?600:400)+';color:'+(isC?'#c8001a':isR?'#5a4030':'rgba(43,29,14,0.3)')+';white-space:nowrap;font-family:monospace">'+(m.label==='1월'?'27.1월':m.label)+'</div>'
      +(isC?'<div class="blink-anim" style="width:3px;height:3px;border-radius:50%;background:#c8001a;margin:2px auto 0"></div>':'')
      +'</div>';
  }).join('');
  return '<div style="width:100%;max-width:300px;margin:0 auto">'
    +'<div style="position:relative;height:8px;background:rgba(43,29,14,0.1);border-radius:2px;overflow:visible">'
    +'<div style="height:100%;border-radius:2px;background:linear-gradient(90deg,#e85a5a,#c8001a);width:'+pct+'%;transition:width 0.5s cubic-bezier(.4,2,.6,1);position:relative;z-index:1"></div>'
    +markers+'</div>'
    +'<div style="position:relative;height:32px;margin-top:4px">'+labels+'</div>'
    +'<div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(43,29,14,0.35);font-family:monospace">'
    +'<span>000</span><span style="color:#8a7060;font-weight:700">'+String(Math.round(pct)).padStart(3,'0')+'%</span><span>'+TOTAL+'</span>'
    +'</div></div>';
}

function render(){
  const remaining=getRemaining(),pct=getPct(),msg=getMessage();
  const R=108,cx=130,cy=130,circ=2*Math.PI*R;
  const strokeOffset=circ*(1-pct/100);

  document.getElementById('root').innerHTML=
    '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px 36px">'

    // 헤더 — 레트로 타이틀
    +'<div style="text-align:center;margin-bottom:28px;padding-left:0">'
    +'<div style="display:inline-block;border:2px solid var(--ink);padding:3px 14px;margin-bottom:8px;background:var(--ink)">'
    +'<span style="font-size:10px;letter-spacing:5px;color:var(--paper);font-family:monospace;text-transform:uppercase">인생은 버티는거야</span>'
    +'</div>'
    +'<div style="font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-0.5px;font-family:\'Libre Baskerville\',Georgia,serif">시간은 결국 흘러</div>'
    +'<div style="font-size:11px;color:var(--ink3);margin-top:6px;font-family:monospace;letter-spacing:1px">'+getTodayLabel()+'</div>'
    +'</div>'

    // 버튼 (빨간 3D 유지 + 레트로 링)
    +'<div id="btnWrap" style="position:relative;width:260px;height:260px;cursor:'+(remaining>0?'pointer':'default')+'">'
    // 링 — 눈금자 스타일
    +'<svg width="260" height="260" style="position:absolute;inset:0;transform:rotate(-90deg)">'
    // 눈금 틱
    +Array.from({length:36},(_,i)=>{
      const a=i*(Math.PI*2/36),r1=122,r2=i%3===0?114:118;
      const x1=130+r1*Math.cos(a),y1=130+r1*Math.sin(a),x2=130+r2*Math.cos(a),y2=130+r2*Math.sin(a);
      return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="rgba(43,29,14,0.18)" stroke-width="'+(i%3===0?2:1)+'"/>';
    }).join('')
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="rgba(43,29,14,0.1)" stroke-width="7"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#c8001a" stroke-width="7" stroke-dasharray="'+circ+'" stroke-dashoffset="'+strokeOffset+'" stroke-linecap="butt" style="transition:stroke-dashoffset 0.5s cubic-bezier(.4,2,.6,1)"/>'
    +'</svg>'

    // 베이스
    +'<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-42%);width:186px;height:186px;border-radius:50%;background:#444;border:4px solid #222;box-shadow:0 8px 0 #111"></div>'

    // 돔 (빨간 3D)
    +'<div id="dome" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);width:170px;height:170px;border-radius:50%;background:#e8001a;border:4px solid #222;box-shadow:0 8px 0 #222,0 10px 0 #900010;transition:transform 0.08s ease,box-shadow 0.08s ease,background 0.08s">'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<div id="bigNum" style="font-size:68px;font-weight:900;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,0.3);letter-spacing:-2px;transition:transform 0.12s cubic-bezier(.4,2,.6,1);font-family:\'Libre Baskerville\',Georgia,serif">'+remaining+'</div>'
    +'<div style="font-size:12px;color:rgba(255,255,255,0.85);margin-top:5px;font-weight:700;letter-spacing:2px;font-family:monospace">일 남음</div>'
    +'<div style="font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px;font-family:monospace">'+(done>0?done+'일 완료':'')+'</div>'
    +'<div id="minusOne" style="display:none;font-size:18px;color:#ffd93d;margin-top:2px;font-weight:900">−1</div>'
    +'</div></div>'
    +'<div id="glowEl" style="display:none;position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(200,0,26,0.2) 0%,transparent 70%);pointer-events:none"></div>'
    +'</div>'

    // 메시지
    +'<div style="text-align:center;margin-top:20px;margin-bottom:16px">'
    +'<div style="font-size:14px;font-weight:800;color:var(--ink);font-family:\'Libre Baskerville\',Georgia,serif">'+msg.text+'</div>'
    +'<div style="font-size:11px;color:var(--ink3);margin-top:4px;font-family:monospace">'+msg.sub+'</div>'
    +(remaining>0?'<div style="font-size:10px;color:var(--ink3);margin-top:3px;opacity:0.6;font-family:monospace">다음 폭죽까지 '+(remaining%10===0?10:remaining%10)+'일</div>':'')
    +'</div>'

    // 글귀
    +'<div id="quoteArea" style="margin-bottom:20px;width:100%;display:flex;justify-content:center;padding:0 20px"></div>'

    // 진행 바
    +'<div style="width:100%;max-width:340px;padding:0 20px;margin-bottom:24px" id="progressBar"></div>'

    // 하단 버튼
    +'<div style="display:flex;gap:8px">'
    +'<button id="undoBtn" '+(done===0?'disabled':'')+' class="retro-btn" style="background:transparent;border:2px solid '+(done===0?'rgba(43,29,14,0.2)':'var(--ink2)')+';color:'+(done===0?'rgba(43,29,14,0.25)':'var(--ink2)')+';padding:7px 18px">↩ 취소</button>'
    +'<button id="resetBtn" '+(done===0?'disabled':'')+' class="retro-btn" style="background:transparent;border:2px solid '+(done===0?'rgba(43,29,14,0.15)':'rgba(43,29,14,0.3)')+';color:'+(done===0?'rgba(43,29,14,0.2)':'var(--ink3)')+';padding:7px 18px">초기화</button>'
    +'</div>'
    +'</div>';

  document.getElementById('progressBar').innerHTML=renderProgressBar();
  renderQuote();
  bindEvents();
}

function pressAnimate(){
  const dome=document.getElementById('dome'),num=document.getElementById('bigNum');
  const glow=document.getElementById('glowEl'),minus=document.getElementById('minusOne');
  if(dome){dome.style.transform='translate(-50%,-50%)';dome.style.boxShadow='0 2px 0 #222';dome.style.background='#b0000f';}
  if(num){num.style.transform='scale(0.88) rotate(-3deg)';}
  if(glow){glow.style.display='block';glow.style.animation='none';void glow.offsetWidth;glow.style.animation='glowFade 0.6s ease-out forwards';}
  if(minus){minus.style.display='block';minus.className='fadeup-anim';}
  setTimeout(()=>{
    if(dome){dome.style.transform='translate(-50%,-56%)';dome.style.boxShadow='0 8px 0 #222,0 10px 0 #900010';dome.style.background='#e8001a';}
    if(num){num.style.transform='scale(1) rotate(0deg)';num.textContent=getRemaining();}
    if(glow)glow.style.display='none';
    if(minus){minus.style.display='none';minus.className='';}
  },550);
}

function bindEvents(){
  document.getElementById('btnWrap')?.addEventListener('click',handlePress);
  document.getElementById('undoBtn')?.addEventListener('click',()=>{
    if(done>0){offset--;saveOffset(offset);done=Math.max(0,Math.min(TOTAL,calcDoneFromDate()+offset));render();}
  });
  document.getElementById('resetBtn')?.addEventListener('click',()=>{
    offset=0;saveOffset(0);done=calcDoneFromDate();quote=null;quoteVisible=false;render();
  });
}

function handlePress(){
  if(done>=TOTAL||animating)return;
  animating=true;offset++;saveOffset(offset);
  done=Math.max(0,Math.min(TOTAL,calcDoneFromDate()+offset));
  pressAnimate();
  const r=getRemaining();
  setTimeout(()=>{animating=false;render();},650);
  if(r%10===0){setTimeout(()=>{launchFireworks();showFireworkOverlay(r);},300);}
  loadQuote(r);
}

const st=document.createElement('style');
st.textContent='@keyframes glowFade{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.3)}}';
document.head.appendChild(st);

render();
</script>
</body>
</html>
